<!DOCTYPE html> <!-- Etiqueta que define el documento como HTML 5  para que funcione en el navegador -->
<html lang="en"> <!-- Raiz o etiqueta que envuelve el documento y define el idioma con ingles (ENglish) -->

<head> <!-- Etiqueta que contiene informacion no visible para la pagina -->
    <meta charset="UTF-8"> <!-- Etiqueta que establece la codificacion de caracteres a UTF-8 para admitir acentos y la Ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Etiqueta que hace que la pagina ajuste el ancho de la pagina a la pantalla del dispositivo correspondiente -->
    <title>Salto de linea en HTML</title> <!-- Etiqueta que define el titulo que aparecera en la pestaña del navegador -->
</head> <!-- Etiqueta que cierra la seccion de inforacion de configuracion no visible -->

<body> <!-- Etiqueta del contenedor principal para todo el contenido visible en la pagina web -->
    <h1>Lenguaje de programacion</h1> <!-- Etiqueta con titulo de nivel 1 que representa el encabezado principal de la pagina -->
    <p> <!-- Etiqueta que inicia un parrafo de texto -->
        En la actualidad se utilizan diferentes
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:<br> <!-- Etiqueta que hace un salto de linea en esta parte especifica del parrafo -->
        Dart<br> <!-- Etiqueta que hace un salto de linea en esta parte especifica del parrafo -->
        Flutter<br> <!-- Etiqueta que hace un salto de linea en esta parte especifica del parrafo -->
        Python<br> <!-- Etiqueta que hace un salto de linea en esta parte especifica del parrafo -->
        Ruby<br> <!-- Etiqueta que hace un salto de linea en esta parte especifica del parrafo -->
        Java<br> <!-- Etiqueta que hace un salto de linea en esta parte especifica del parrafo -->
        TypeScript<br> <!-- Etiqueta que hace un salto de linea en esta parte especifica del parrafo -->
        Entre otros.
    </p> <!-- Etiqueta que cierr aun parrafo de texto -->
</body> <!-- Etiqueta que cierra del contenerdor principal para todo el contenido visible en la pagina web -->
</html> <!-- Etiqueta que cierra la raiz que envuelve todo el documento HTML -->
