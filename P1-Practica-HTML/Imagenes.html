<!DOCTYPE html> <!-- Etiqueta que define el documento como HTML 5  para que funcione en el navegador -->
<html lang="en"> <!-- Raiz o etiqueta que envuelve el documento y define el idioma con ingles (ENglish) -->
<head> <!-- Etiqueta que contiene informacion no visible para la pagina -->
    <meta charset="UTF-8"> <!-- Etiqueta que establece la codificacion de caracteres a UTF-8 para admitir acentos y la Ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Etiqueta que hace que la pagina ajuste el ancho de la pagina a la pantalla del dispositivo correspondiente -->
    <title>Imagenes en HTML</title> <!-- Etiqueta que define el titulo que aparecera en la pestaña del navegador -->
</head> <!-- Etiqueta que cierra la seccion de inforacion de configuracion no visible -->
<body> <!-- Etiqueta del contenedor principal para todo el contenido visible en la pagina web -->
    <h2>Imagenes en HTML</h2> <!-- Etiqueta con titulo de nivel 2 que funciona como encabezado de la pagina web -->
    <h3>Locales</h3> <!-- Etiqueta con titulo de nivel 3 que funciona como subtitulo -->
    <img src="caritas.png" alt="Imagen de carita feliz"> <!-- Etiqueta que define una imagen llamada de forma local con su fuente y una descripcion en caso de no ser mostrada -->
    <h3>Locales redismensionado</h3> <!-- Etiqueta con titulo de nivel 3 que funciona como subtitulo -->
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!-- Etiqueta que define una imagen llamada de forma local con su fuente, sin descripcion, con una anchura de 200px y altura de 100px -->
    <h3>Desde internet</h3> <!-- Etiqueta con titulo de nivel 3 que funciona como subtitulo -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" width="200" height="200" alt=""> <!-- Etiqueta que define una imagen llamada desde la web mediante un hipervinculo, define su anchura de 200 px y altura de 200 px, no tiene descripcion -->
    <h3>Animaciones</h3> <!-- Etiqueta con titulo de nivel 3 que funciona como subtitulo -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" width="200" height="200" alt=""> <!-- Etiqueta que define un gif llamado desde la web mediante un hipervinculo, define su anchura de 200px y su altura de 200px, no tiene descripcion -->
</body> <!-- Etiqueta que cierra del contenerdor principal para todo el contenido visible en la pagina web -->
</html> <!-- Etiqueta que cierra la raiz que envuelve todo el documento HTML -->
